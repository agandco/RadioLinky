    <style>
        :root { 
            --accent: #ffffff; 
            --bg: #000000;     
            --text: #ffffff;   
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Montserrat', sans-serif; 
            width: 100%;
            height: 100vh;
            overflow: auto;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-overflow-scrolling: touch;
        }

        .menu-container {
            width: 100%;
            background: var(--bg);
            border-bottom: 2px solid var(--accent);
            z-index: 1000;
        }

        .cat-header { 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
        }

        .cat-header span {
            font-weight: 900;
            letter-spacing: 3px;
            font-size: 1.2rem;
        }

        .menu-content { 
            display: none; 
            padding: 15px;
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px;
            background: #000;
            padding-bottom: 50px;
            margin-top: -25px;
        }

        .menu-content small {
            grid-column: span 2;
            margin-top: 10px;
            margin-bottom: 0px;
            color: var(--accent);
            opacity: 0.6;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }

                .nav-link {
    position: relative;
    padding: 20px 0px;
    display: flex; 
    flex-direction: column; 
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #000; 
    color: #ffffff !important;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 900;
    font-size: 0.75rem;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    
    /* 1. Isolation de la carte pour gérer les z-index proprement */
    isolation: isolate; 
}

.nav-link::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.60);
    /* 2. Place le calque en arrière-plan (-1 par rapport au contenu du lien) */
    z-index: -1; 
    transition: background 0.3s ease;
}

.nav-link:active::before {
    background: rgba(0, 0, 0, 0.4);
}

.nav-link i,
.nav-link svg { 
    width: 20px; 
    height: 20px; 
    stroke: #ffffff !important;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
}


        .donate-link { border-color: #fff; }

        /* Bannières personnalisées pour chaque application (Ajuste les chemins d'accès vers tes images) */

        .nav-link.bg-meteo   { background-image: url('https://img.magnific.com/premium-vector/3d-different-weather-icons-set-cartoon-style-vector_269504-4539.jpg'); }
        .nav-link.bg-note    { background-image: url('https://e7.pngegg.com/pngimages/148/948/png-clipart-message-box-illustration-rectangle-quotation-purple-purple-rectangle-reference-box-text-violet-thumbnail.png'); }
        .nav-link.bg-calcul  { background-image: url('https://static.vecteezy.com/system/resources/previews/006/876/522/non_2x/calculator-witn-coins-card-and-banknote-3d-banner-with-copy-space-vector.jpg'); }

<body oncontextmenu='return false;' onkeydown='return false;' onmousedown='return false;'>
        
    <div id="pwa-install-container" style="display: none; position: fixed; top: 18px; right: 60px; z-index: 9999;">
        <button id="pwa-install-btn" style="background: #fff; color: #000; border: 2px solid #fff; padding: 8px 15px; border-radius: 50px; font-weight: 900; font-family: 'Montserrat', sans-serif; font-size: 10px; box-shadow: 0 0 15px rgba(255,255,255,0.3); display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <i data-lucide="download" style="width:14px; height:14px;"></i> INSTALLER
        </button>
    </div>

    <div class="menu-container" id="header-menu">
        <div class="cat-header" onclick="toggleMenu()">
            <span>MENU</span>
            <i data-lucide="chevron-down" id="menu-icon" style="transition: 0.3s;"></i>
        </div>
        <div class="menu-content" id="menu-links">
            <hr>
            <small>APPLICATIONS :</small>

            <a href="radio.html" target="app-viewport" class="nav-link bg-radio" onclick="handleNav()">
                <i data-lucide="radio"></i>RADIO
            </a>
            <a href="mp3.html" target="app-viewport" class="nav-link bg-mp3" onclick="handleNav()">
                <i data-lucide="music"></i>MP3
            </a>
            <a href="linky.html" target="app-viewport" class="nav-link bg-linky" onclick="handleNav()">
                <i data-lucide="link"></i>LINKY
            </a>
            <a href="tube.html" target="app-viewport" class="nav-link bg-tube" onclick="handleNav()">
                <i data-lucide="play-circle"></i>TUBE
            </a>
            <a href="clock.html" target="app-viewport" class="nav-link bg-clock" onclick="handleNav()">
                <i data-lucide="clock"></i>CLOCK
            </a>
            <a href="meteo.html" target="app-viewport" class="nav-link bg-meteo" onclick="handleNav()">
                <i data-lucide="cloud-sun"></i>METEO
            </a>
            <a href="note.html" target="app-viewport" class="nav-link bg-note" onclick="handleNav()">
                <i data-lucide="sticky-note"></i>NOTE
            </a>
            <a href="calcul.html" target="app-viewport" class="nav-link bg-calcul" onclick="handleNav()">
                <i data-lucide="calculator"></i>CALCUL
            </a>

            <hr>

            <a href="#" class="nav-link" id="share-app-btn">
                <i data-lucide="share-2"></i>PARTAGER
            </a>

                <i data-lucide="heart"></i>FAIRE UN DON
            </a>
            
            <hr>
            <small>CONTACT & INFOS :</small>

            <a href="mailto:agandco.contact@gmail.com?subject=Contact depuis Radiolinky" class="nav-link">
                <i data-lucide="mail"></i>CONTACT
            </a>
            <a href="info.html" target="app-viewport" class="nav-link" onclick="handleNav()">
                <i data-lucide="info"></i>INFOS
            </a>
        </div>
    </div>
        
    <div class="app-frame-container">
        <iframe src="info.html" name="app-viewport" class="app-frame"></iframe>
    </div>

    <script>
        lucide.createIcons();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            });
        }

        function toggleMenu() {
            const content = document.getElementById('menu-links');
            const icon = document.getElementById('menu-icon');
            const isOpen = content.style.display === 'grid';
            content.style.display = isOpen ? 'none' : 'grid';
            icon.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
            updateFrameHeight();
        }

        function updateFrameHeight() {
            const headerHeight = document.getElementById('header-menu').offsetHeight;
            const container = document.querySelector('.app-frame-container');
            container.style.height = `calc(100dvh - ${headerHeight}px)`;
        }

        function handleNav() { toggleMenu(); }

        window.addEventListener('resize', updateFrameHeight);
        window.addEventListener('load', updateFrameHeight);

        let wakeLock = null;
        const requestWakeLock = async () => {
            try {
                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
            } catch (err) {}
        };
        requestWakeLock();
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') { requestWakeLock(); }
        });
        
        let deferredPrompt;
        const installContainer = document.getElementById('pwa-install-container');
        const installBtn = document.getElementById('pwa-install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!window.matchMedia('(display-mode: standalone)').matches) {
                installContainer.style.display = 'block';
            }
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') { installContainer.style.display = 'none'; }
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            installContainer.style.display = 'none';
            deferredPrompt = null;
        });

        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            installContainer.style.display = 'none';
        }
        
        const shareLockObserver = new MutationObserver(() => {
            if (typeof state !== 'undefined' && state.current && state.current[state.idx]) {
                const t = state.current[state.idx];
                if (t && t.isMP3) {
                    const shareBtn = document.getElementById('btn-share-stream');
                    if (shareBtn && shareBtn.style.display !== 'none') {
                        shareBtn.style.setProperty('display', 'none', 'important');
                        shareBtn.classList.add('hidden');
                    }
                }
            }
        });
        shareLockObserver.observe(document.body, { childList: true, subtree: true, attributes: true });
    
        document.getElementById('share-app-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const shareData = {
                title: 'RADIOLINKY',
                text: 'Découvrez RADIOLINKY, votre espace tout-en-un : radio en ligne, lecteur MP3 performant, calculatrice, ainsi que vos gestionnaires personnels de favoris, liens, notes et vidéos YouTube. Tout est accessible ici :',
                url: 'https://radiolinky.com'
            };
            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(shareData.url);
                    alert('Lien copié dans le presse-papier !');
                }
            } catch (err) {
                console.log('Erreur de partage:', err);
            }
        });
    </script>
